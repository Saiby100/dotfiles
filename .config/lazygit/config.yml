# Lazygit config — optimised for reviewing diffs and structuring commits.
# Goal: maximise the diff panel, strip away noise, keep staging fast.

# Quit lazygit when <Esc> is pressed at a top-level panel (it still closes
# popups/menus/search inputs first, as usual). Quitting fires the float's
# on_exit handler (nvim/lua/core/keymaps.lua), which tears down the floating
# window — so a final <Esc> closes the lazygit window inside Neovim.
quitOnTopLevelReturn: true

# When launched outside a git repo (e.g. <leader>gg from a non-repo buffer),
# skip the "create a new repo?" prompt and open the most recent repo instead
# (tracked in lazygit's state.yml).
notARepository: skip

gui:
  # Give the diff (main) panel the most room. Side panels shrink, and the
  # focused side panel expands on demand so file lists stay readable.
  sidePanelWidth: 0.28
  expandFocusedSidePanel: true
  mainPanelSplitMode: flexible
  # Hide the chatter. The command log and bottom donate/info line are the
  # main sources of "unnecessary info" in the default layout.
  showCommandLog: false
  showBottomLine: false
  showPanelJumps: true
  # File tree on by default (toggle with `). Tree view stays active on launch.
  showFileTree: true
  # Show staged/unstaged icons so it's obvious what's going into the commit.
  showNumstatInFilesView: true
  nerdFontsVersion: "3"
  scrollHeight: 4
  # Theme — onedark, same palette as tmux/Neovim/ghostty. Blue is structure, so
  # the focused panel border is the blue the tmux session cap and active pane
  # border already use; the unfocused border is that blue bled into the
  # background (#324456), which is what tmux draws around inactive panes.
  theme:
    activeBorderColor:
      - "#61afef"
      - bold
    inactiveBorderColor:
      - "#324456"
    selectedLineBgColor:
      - "#3e4452"
    selectedRangeBgColor:
      - "#3e4452"
    optionsTextColor:
      - "#61afef"
    cherryPickedCommitBgColor:
      - "#3a2f45"
    cherryPickedCommitFgColor:
      - "#c678dd"
    unstagedChangesColor:
      - "#e06c75"
git:
  # Use delta for syntax-highlighted, word-level diffs inside lazygit.
  pagers:
    - colorArg: always
      pager: delta --paging=never --line-numbers --hunk-header-style=omit
  # More context around each hunk makes review (and splitting commits) easier.
  diffContextSize: 5
  parseEmoji: false
os:
  # Open files in the HOST nvim when lazygit runs inside it ($NVIM set), and fall
  # back to a fresh nvim when run standalone (`lg` alias, $NVIM unset).
  #
  # The stock `nvim-remote` preset is unusable: lazygit lives in a floating
  # window, which is nvim's *current* window when the edit RPC arrives, so
  # `--remote` drops the file into that cramped float. So `--remote` still opens
  # the file (it handles {{filename}} quoting), then a separate, argument-free
  # `--remote-expr` calls a host-side Lua helper (nvim/lua/core/keymaps.lua) that
  # re-homes the buffer into a real window. Argument-free on purpose: lazygit
  # double-quotes the filename and the shell would strip those quotes, leaving an
  # invalid Vimscript expression. {{line}} is a bare number, so it is safe.
  #
  # editPreset pins `suspend: false`: the suspend flag comes from the PRESET, not
  # the command templates below. Without it lazygit guesses the `nvim` preset
  # from $EDITOR and suspends — taking over the terminal and hanging.
  editPreset: "nvim-remote"
  edit: '[ -z "$NVIM" ] && nvim -- {{filename}} || { nvim --server "$NVIM" --remote {{filename}}; nvim --server "$NVIM" --remote-expr "v:lua._lazygit_fixup()" >/dev/null; }'
  editAtLine: '[ -z "$NVIM" ] && nvim +{{line}} -- {{filename}} || { nvim --server "$NVIM" --remote {{filename}}; nvim --server "$NVIM" --remote-expr "v:lua._lazygit_fixup({{line}})" >/dev/null; }'
  openDirInEditor: '[ -z "$NVIM" ] && nvim -- {{dir}} || { nvim --server "$NVIM" --remote {{dir}}; nvim --server "$NVIM" --remote-expr "v:lua._lazygit_fixup()" >/dev/null; }'
# Reviewing often means committing only part of the tree — make that fast.
keybinding:
  universal:
    edit: "e" # open the file under the cursor in $EDITOR (nvim) to tweak before staging
