# --- General Settings ---
unbind C-b
set-option -g prefix C-Space
# Re-arm the prefix table instead of cancelling it, so a double-tap is a no-op.
# Gives up the default send-prefix needed for nested sessions.
bind-key C-Space switch-client -T prefix

# tmux-256color, not screen-256color: the legacy screen terminfo
# under-describes tmux's cursor/wrap/clear-line capabilities, which makes
# in-place-redrawing TUIs overlap or leave leftover characters.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g allow-passthrough on

# Extended (CSI u) key reporting, for the S-Enter binding below.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g mouse on

# Drag a window along the status bar to reorder it. The pane is marked on press
# purely to pin swap-window's source: with a marked pane present swap-window
# takes the marked window as the source and the mark travels with the window,
# so the grabbed window keeps being the one that moves. Without the mark the
# source is the current window, which drifts as the swaps land.
bind-key -n MouseDown1Status { switch-client -t= ; select-pane -m }
bind-key -n MouseDrag1Status swap-window -d -t=
bind-key -n MouseDragEnd1Status select-pane -M
bind-key -n MouseUp1Status select-pane -M
# Those two only fire when the release lands back on the status bar. Press there
# and let go over a pane and the mark survives, which tmux then draws as a
# reverse-video (solid, filled) pane border. MouseUp1Pane has no default root
# binding — drag-selection ends arrive as MouseDragEnd1Pane in the copy-mode
# table — so clearing here catches the stray release without costing anything.
bind-key -n MouseUp1Pane select-pane -M

set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

set -s escape-time 0

# Shift+Enter through to applications (e.g. Claude Code newline).
bind-key -n S-Enter send-keys Escape "[13;2u"

# --- Vim Style Split & Navigation ---
unbind '"'
unbind %
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# -b opens the new pane *before* the current one: + to the left, _ above.
bind + split-window -h -b -c "#{pane_current_path}"
bind _ split-window -v -b -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

setw -g mode-keys vi
bind v copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Pipe to pbcopy so yanks share the + register with Neovim's
# clipboard=unnamedplus; otherwise tmux keeps them in its own buffer.
set -g set-clipboard on
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# --- Window Naming ---
# Name windows after the pane's directory rather than the running command.
# Windows renamed by hand keep their name (tmux disables auto-rename per-window).
set -g automatic-rename-format '#{b:pane_current_path}'

# --- New Window ---
# Skipping the prompt has to fall back, and does not by itself: `new-window -n ''`
# leaves the name empty AND turns automatic-rename off, so the window keeps a
# blank label forever. Turning automatic-rename back on when the name came back
# empty hands it to automatic-rename-format. A name that *was* typed leaves
# automatic-rename off, so it sticks.
bind c command-prompt -p "Window name:" \
  "new-window -c '#{pane_current_path}' -n '%%' ; if-shell -F '#{==:#{window_name},}' 'set -w automatic-rename on'"

# --- Sessions ---
bind C command-prompt -p "New session name:" "new-session -s '%%'"

# Unbound rather than deleted: sourcing this file does not clear bindings it no
# longer mentions, so a plain deletion leaves the old key alive.
unbind s

# --- The Tree Popup ---
# tree.sh lists every session, window and pane in the server as a fuzzy-matchable
# tree, and acts on them. Keys inside the popup: enter jumps, m mark, M move
# marked here, U unmark all, n new, r rename, x kill, h/l fold, j/k move, :N go
# to a row, p or ? toggles the preview, i or / searches.
#
# -E closes the popup when the script exits; without it the popup outlives the
# command and has to be dismissed by hand.
bind w display-popup -E -w 80% -h 80% "~/.config/tmux/tree.sh"

# --- Quick Reload ---
bind r source-file ~/.tmux.conf \; display "tmux config reloaded!"


# --- Resize Panes ---
set -g repeat-time 1000
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Fullscreen Pane ---
bind m resize-pane -Z

# --- Swap Panes ---
# -d reads backwards here: it means "don't change the active pane", i.e. keep
# focus on *this* pane, which rides along to the new slot. Without it focus
# stays at the old position and you land in the pane that swapped in.
bind S command-prompt -p "Swap with pane:" "swap-pane -d -t '%%'"

# --- Close Pane ---
bind-key -n C-q confirm-before -p "kill-pane #P? (y/n)" kill-pane

# --- Moving Panes and Windows ---
# Superseded by the tree popup's marks. Unbound rather than deleted, for the
# reason given above bind w.
unbind g
unbind G

bind b break-pane

# --- Palette ---
# onedark, matching the Neovim theme and ghostty's "One Double Dark". Defined
# as user options so every colour below has one source of truth; tmux expands
# #{@name} inside style options too, not just status-left/right.
# Blue is the structural accent: the session cap, the focused border and the
# path readouts are all one colour, so "where am I" reads as a single cue.
# Green/yellow/red are kept for state alone (done / attention / danger) — they
# never carry structure, which is what made the green focus border misread.
# Purple is the modal colour: tmux itself is waiting on a keystroke (LEADER,
# a command prompt, display-panes). Split out of yellow, which was carrying
# both "tmux wants input" and "something wants your attention". @bg_purple is
# the same hue sunk into the background, so the active window tab shares the
# family without competing with the bright LEADER cap.
set -g @bg     "#282c34"   # editor background
set -g @bg_purple "#443a52"  # purple bled into @bg — the active window tab
set -g @border "#324456"   # blue bled into @bg — dimmer than any text
set -g @fg     "#aab2bf"
set -g @white  "#ffffff"   # brighter than @fg — for the few live readouts
set -g @muted  "#5c6370"   # comment grey — inactive text
set -g @blue   "#61afef"
set -g @purple "#c678dd"
set -g @green  "#98c379"
set -g @yellow "#e5c07b"
set -g @red    "#e06c75"

# --- Status Bar ---
# Sits at the top: Neovim's lualine owns the bottom row of every editor pane,
# so a bottom tmux bar stacks into one noisy block.
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#{@bg},fg=#{@muted}"
set -g status-justify left

# Left: session name in a rounded cap, turning purple and reading LEADER while
# the prefix is pending. Trailing ·N is the server's session count, hidden at
# one session. claude-sessions.sh then adds a Claude-state dot for sessions you
# are *not* attached to (yellow blocked, green done); it prints its own leading
# space and resolves the palette itself, so this stays a single #() call.
set -g status-left-length 44
set -g status-left "#[fg=#{?client_prefix,#{@purple},#{@blue}},bg=#{@bg}]#[fg=#{@bg},bg=#{?client_prefix,#{@purple},#{@blue}},bold] #{?client_prefix,LEADER,#S#{?#{>:#{server_sessions},1},·#{server_sessions},}#(~/.config/tmux/claude-sessions.sh)} #[fg=#{?client_prefix,#{@purple},#{@blue}},bg=#{@bg}] "

# Windows: inactive sit flat on the background, the active one gets a muted
# purple block and a bright purple index. 󰊓 marks a zoomed pane.
#
# Inactive windows carry a Claude Code state dot, set by
# ~/.claude/tmux-claude-state.sh off Claude's hooks: yellow blocked on you,
# green finished its turn. That script records the same state at pane and
# session scope under @claude_pane_state and @claude_session_state; this format
# wants the window one, which is why the three have separate names rather than
# relying on tmux's pane → window → session option fallback. Deliberately
# absent from window-status-current-format — see after-select-window below.
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@muted}] #I #W#{?window_zoomed_flag, 󰊓,} #{?#{==:#{@claude_state},waiting},#[fg=#{@yellow}]● ,#{?#{==:#{@claude_state},done},#[fg=#{@green}]● ,}} "
set -g window-status-current-format "#[bg=#{@bg_purple}] #[fg=#{@purple},bold]#I #[fg=#{@fg},nobold]#W#{?window_zoomed_flag, 󰊓,} "

# Right: CPU and memory load, the clock, then the Tailscale glyph pinned to the
# far corner — it is a state light rather than a reading, so it sits at the edge
# instead of between two numbers. Both scripts print already-coloured output and
# resolve the palette themselves, so each stays a single #() call.
set -g status-right-length 70
set -g status-right "#(~/.config/tmux/sys-status.sh) #[fg=#{@white},bg=#{@bg}] %H:%M #(~/.config/tmux/tailscale-status.sh) "

# Looking at something means you've seen whatever Claude wanted there, so drop
# its state. One hook per scope, since each becomes stale at a different moment.
# after-select-window also clears the pane scope because switching windows does
# not fire after-select-pane.
set-hook -g after-select-pane 'set-option -up @claude_pane_state'
set-hook -g after-select-window 'set-option -uw @claude_state ; set-option -up @claude_pane_state'
set-hook -g client-session-changed 'set-option -u @claude_session_state'

set -g message-style "fg=#{@bg},bg=#{@purple},bold"
set -g message-command-style "fg=#{@bg},bg=#{@purple},bold"
set -g mode-style "fg=#{@bg},bg=#{@yellow}"
# These two take a bare colour rather than a style, and colour options are not
# format-expanded — so the palette vars above can't be used here.
set -g display-panes-colour "#61afef"        # @blue
set -g display-panes-active-colour "#c678dd" # @purple

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'

# --- Active Pane Indicator ---
# No border arrows — the active pane is distinguished by its border colour.
set -g pane-border-indicators off

# Each pane's index in its border, plus its title when something has set one.
# tmux defaults the title to the hostname, so that case is suppressed as noise.
set -g pane-border-status top
set -g pane-border-format " #P#{?#{==:#{pane_title},#{host}},, · #{pane_title}} "
set -g pane-border-style "fg=#{@border}"

# Background rather than window-style dimming: dimming only dulls
# default-coloured text, so syntax highlighting stays bright and the cue is
# inconsistent. A background applies to every cell.
set -g window-style        "default"
set -g window-active-style "bg=#31353f"

# --- Mode-Aware Active Border ---
#   copy/view mode (pane_in_mode) → yellow
#   synchronize-panes broadcast   → red  (typing hits every pane)
#   otherwise                     → blue, the same blue as the session cap
set -g pane-active-border-style "#{?pane_in_mode,fg=#{@yellow},#{?synchronize-panes,fg=#{@red},fg=#{@blue}}}"

# tpm does NOT auto-fetch declared plugins — it only installs on demand
# (prefix + I), so without this a fresh machine comes up with the config sourced
# but no plugin bindings. Missing plugins are detected via the navigator dir.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"
if "test ! -d ~/.tmux/plugins/vim-tmux-navigator" \
   "run '~/.tmux/plugins/tpm/bin/install_plugins'"
